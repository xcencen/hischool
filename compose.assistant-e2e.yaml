# Test-only overlay. Requires a NEW disposable project; never use production env.
# E2E_ARTIFACT_DIR and E2E_DIST_DIR must be F-drive disposable artifact directories.
services:
  api:
    extends:
      file: compose.assistant-test.yaml
      service: tests
    image: my-campus-ai-m2-test-tests:latest
    command: [python, -B, tests/support/assistant_e2e_server.py, --isolated]
    healthcheck:
      test: [CMD, python, -c, "from pathlib import Path; from urllib.request import urlopen; assert Path('/artifacts/ready.json').is_file(); assert urlopen('http://127.0.0.1:8000/api/ready', timeout=2).status == 200"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 30s
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/tests:/app/tests:ro
      - ./backend/migrations:/app/migrations:ro
      - ${E2E_ARTIFACT_DIR:?set disposable F-drive artifact directory}:/artifacts
    networks:
      default:
        aliases: [api]
  e2e-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${E2E_DIST_DIR:?set production build directory}:/usr/share/nginx/html:ro
    ports: ["127.0.0.1:18765:80"]
    depends_on: [api]
